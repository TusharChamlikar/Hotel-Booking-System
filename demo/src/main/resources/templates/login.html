<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            background-color: #8bb3f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            height: auto;
            width: 400px;
            background-color: #042b69;
            border: 3px solid antiquewhite;
            border-radius: 15px;
            padding: 30px;
            color: bisque;
            font-size: 1.2rem;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-control {
            width: 90%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        .form-control:focus {
            outline: none;
            border-color: #8bb3f3;
            box-shadow: 0 0 8px rgba(139, 179, 243, 0.8);
        }
        .submit {
            width: 100%;
            padding: 12px;
            background-color: #8bb3f3;
            border: none;
            border-radius: 5px;
            color: #042b69;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit:hover {
            background-color: #75a3e4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LOGIN FORM</h1>
        <form action="#" th:action="@{/login}" th:object="${credentials}" method="post">
            <div class="username1">
                <label for="username">Enter Your Username</label>
                <input id="username" class="form-control" type="text" th:field="${credentials.username}" placeholder="Username">
            </div>
            <div class="pass">
                <label for="password">Enter Password</label>
                <input id="password" class="form-control" type="password" th:field="${credentials.password}" placeholder="Password">
            </div>
            <button class="submit" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
